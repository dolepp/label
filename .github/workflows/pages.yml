name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          mkdir -p _site/release/new _site/admin
          cp site/cabinet.html _site/index.html
          cp site/cabinet.html _site/release/new/index.html
          cp site/admin.html _site/admin/index.html
          cp -R site/assets _site/assets
          sed -i 's|<meta name="twas-api-base" content="">|<meta name="twas-api-base" content="https://api.twaslabel.ru:8443">|' _site/index.html _site/release/new/index.html _site/admin/index.html
          cp _site/index.html _site/404.html
          echo 'twaslabel.ru' > _site/CNAME
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment

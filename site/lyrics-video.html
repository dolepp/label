<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark viewing stage on the left that stays put, a scrolling rack of controls on the right; stacks on phones. */
:root {
  --bg: #efecf4;
  --surface: #faf9fc;
  --surface-2: #e6e2ee;
  --line: #d2ccde;
  --fg: #1c1826;
  --muted: #645d75;
  --accent: #c2255c;
  --accent-fg: #ffffff;
  --accent-soft: #f6dbe5;
  --signal: #0b7f76;
  --stage: #15121c;
  --stage-fg: #efeaf6;
  --stage-muted: #9d95b0;
  --stage-line: #322c40;
  --warn: #a15c00;
  --f-display: "Unbounded", "Golos Text", system-ui, sans-serif;
  --f-body: "Golos Text", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15121c; --surface: #1e1a28; --surface-2: #2a2536; --line: #3a3349; --fg: #f1edf7; --muted: #a59db7;
    --accent: #ff6b93; --accent-fg: #26101a; --accent-soft: #3c2030; --signal: #55d6c8;
    --stage: #0c0a11; --stage-fg: #efeaf6; --stage-muted: #9d95b0; --stage-line: #2b2637; --warn: #f0b35a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15121c; --surface: #1e1a28; --surface-2: #2a2536; --line: #3a3349; --fg: #f1edf7; --muted: #a59db7;
  --accent: #ff6b93; --accent-fg: #26101a; --accent-soft: #3c2030; --signal: #55d6c8;
  --stage: #0c0a11; --stage-fg: #efeaf6; --stage-muted: #9d95b0; --stage-line: #2b2637; --warn: #f0b35a;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.45;
  padding-inline: 20px;
  padding-block: 18px 40px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 1480px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand .logo { width: 44px; height: 50px; flex: none; display: block; background: var(--fg); visibility: hidden; -webkit-mask: center / contain no-repeat; mask: center / contain no-repeat; }
.brand .logo.ready { visibility: visible; }
.themebox { display: flex; align-items: center; gap: 8px; }
.themebox .cap { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.themebox .seg { flex-wrap: nowrap; }
.themebox .seg button { background: var(--surface); padding: 5px 10px; font-size: 13px; white-space: nowrap; }
.brandtext { display: flex; align-items: baseline; gap: 4px 16px; flex-wrap: wrap; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -0.01em; margin: 0; }
.brand h1 i { font-family: var(--f-mono); font-style: normal; font-weight: 500; font-size: 0.78em; letter-spacing: 0; color: var(--accent); white-space: nowrap; }
.brand p { margin: 0; color: var(--muted); font-size: 14px; }

.work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(330px, 430px); gap: 22px; align-items: start; }
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 14px); min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.screen { background: var(--stage); color: var(--stage-fg); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.viewer { position: relative; display: flex; justify-content: center; align-items: center; min-height: 180px; }
.viewer canvas { display: block; border-radius: 6px; background: #000; max-width: 100%; }
.badge { position: absolute; left: 10px; top: 10px; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; background: rgba(12, 10, 17, 0.72); color: var(--stage-fg); border: 1px solid var(--stage-line); padding: 4px 8px; border-radius: 4px; }
.drop-hint { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(12, 10, 17, 0.82); color: var(--stage-fg); font-family: var(--f-display); font-size: 18px; border: 2px dashed var(--stage-muted); border-radius: 8px; text-align: center; padding: 16px; }

.transport { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.playbtn { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--stage-fg); color: var(--stage); display: grid; place-items: center; cursor: pointer; }
.playbtn:hover { filter: brightness(0.9); }
.playbtn svg { width: 18px; height: 18px; fill: currentColor; }
.time { font-family: var(--f-mono); font-size: 13px; font-variant-numeric: tabular-nums; color: var(--stage-muted); white-space: nowrap; }
.time b { color: var(--stage-fg); font-weight: 500; }
.tl { height: 46px; min-width: 0; cursor: pointer; touch-action: none; }
.tl canvas { width: 100%; height: 100%; display: block; }
.bpm { font-family: var(--f-mono); font-size: 12px; color: var(--stage-muted); text-align: right; white-space: nowrap; }
.bpm b { display: block; color: var(--stage-fg); font-size: 15px; font-weight: 500; }

.looks { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.looks .cap { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px; }
.stepper button { width: 34px; height: 34px; border: 0; border-radius: 50%; background: none; cursor: pointer; display: grid; place-items: center; }
.stepper button:hover { background: var(--surface-2); }
.stepper .cur { display: grid; justify-items: center; min-width: 132px; padding-inline: 6px; line-height: 1.15; }
.stepper .cur b { font-weight: 600; font-size: 14px; }
.stepper .cur i { font-style: normal; font-family: var(--f-mono); font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 7px 13px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip.dice { border-style: dashed; color: var(--accent); }
.chip.dice[aria-pressed="true"] { color: var(--bg); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-width: 0; overflow: hidden; }
.tabs { display: flex; overflow-x: auto; border-bottom: 1px solid var(--line); scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; border: 0; background: none; padding: 13px 14px 11px; cursor: pointer; font-family: var(--f-display); font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.tabbody { padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
.group { display: flex; flex-direction: column; gap: 11px; }
.group > h3 { font-family: var(--f-mono); font-weight: 500; font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0 0 1px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 12px; align-items: center; min-height: 30px; }
.row.stack { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.row > label, .row > .lbl { font-size: 14px; color: var(--fg); min-width: 0; }
.rng { display: grid; grid-template-columns: minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.rng output { font-family: var(--f-mono); font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); text-align: right; }
input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
select, input[type="text"], input[type="number"], textarea { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0; }
textarea { font-family: var(--f-mono); font-size: 12px; resize: vertical; min-height: 64px; }
input[type="color"] { width: 42px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); cursor: pointer; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; }
.seg button { flex: 1 1 auto; border: 1px solid var(--line); background: var(--bg); padding: 6px 9px; border-radius: 7px; cursor: pointer; font-size: 13.5px; }
.seg button:hover { border-color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--fg); }
.sw { display: inline-flex; align-items: center; justify-self: end; }
.sw input { width: 20px; height: 20px; accent-color: var(--accent); margin: 0; cursor: pointer; }
.inline { display: flex; gap: 8px; align-items: center; min-width: 0; }
.inline > * { min-width: 0; }
.inline > select, .inline > input[type="number"] { flex: 1 1 0; }
.inline > .btn { flex: none; }

.slots { display: grid; gap: 8px; }
.slot { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 12px; align-items: center; border: 1px dashed var(--line); border-radius: 10px; padding: 9px 11px; cursor: pointer; background: var(--bg); }
.slot:hover, .slot.over { border-color: var(--accent); border-style: solid; }
.slot .ico { width: 46px; height: 46px; border-radius: 7px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.slot .ico img, .slot .ico canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.slot .name { font-weight: 500; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .sub { font-size: 12.5px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slot .pick { font-size: 13px; color: var(--accent); white-space: nowrap; }
.slot input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.slot:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.note { font-size: 13px; color: var(--muted); margin: 0; }
.note.warn { color: var(--warn); }
.btn { border: 1px solid var(--line); background: var(--bg); padding: 8px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; padding: 11px 18px; }
.btn.primary:hover { filter: brightness(1.07); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.spec { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; font-family: var(--f-mono); font-size: 12.5px; margin: 0; }
.spec dt { color: var(--muted); }
.spec dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); }
.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; max-width: min(92vw, 560px); z-index: 20; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.25); }

@media (max-width: 980px) {
  body { padding-inline: 16px; }
  .work { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
  .transport { grid-template-columns: auto minmax(0, 1fr) auto; }
  .transport .tl { grid-column: 1 / -1; grid-row: 2; }

<script>
/* ---------- MP4 muxer (ISO BMFF, fast-start, B-frame safe) ---------- */
const Mp4Mux = (() => {
  const te = new TextEncoder();
  const cat = (arrs) => {
    let n = 0;
    for (const a of arrs) n += a.length;
    const o = new Uint8Array(n);
    let p = 0;
    for (const a of arrs) { o.set(a, p); p += a.length; }
    return o;
  };
  const u8 = (...v) => Uint8Array.from(v);
  const u16 = (v) => u8((v >> 8) & 255, v & 255);
  const u32 = (v) => u8((v >>> 24) & 255, (v >>> 16) & 255, (v >>> 8) & 255, v & 255);
  const u64 = (v) => cat([u32(Math.floor(v / 4294967296)), u32(v % 4294967296)]);
  const str = (s) => te.encode(s);
  const zeros = (n) => new Uint8Array(n);
  const box = (type, ...kids) => {
    const body = cat(kids);
    const t = typeof type === 'string' ? str(type) : type;
    return cat([u32(body.length + 8), t, body]);
  };
  const full = (type, ver, flags, ...kids) =>
    box(type, u8(ver, (flags >> 16) & 255, (flags >> 8) & 255, flags & 255), ...kids);
  const MATRIX = cat([0x10000, 0, 0, 0, 0x10000, 0, 0, 0, 0x40000000].map(u32));
  const table = (count, bytesPer, fill) => {
    const buf = new Uint8Array(count * bytesPer);
    const dv = new DataView(buf.buffer);
    for (let i = 0; i < count; i++) fill(dv, i * bytesPer, i);
    return buf;
  };

  const PRIM = { bt709: 1, bt470bg: 5, smpte170m: 6, bt2020: 9, smpte432: 12 };
  const TRC = { bt709: 1, smpte170m: 6, linear: 8, 'iec61966-2-1': 13, pq: 16, hlg: 18 };
  const MAT = { rgb: 0, bt709: 1, bt470bg: 5, smpte170m: 6, 'bt2020-ncl': 9 };

  class Mux {
    /**
     * video: {codec:'avc'|'hevc'|'vp9'|'av1', codecString, width, height}
     * audio: {codec:'aac'|'opus', sampleRate, channels, bitrate} | null
     * tags:  {title, artist}
     */
    constructor({ video, audio, tags }) {
      this.tags = tags || {};
      this.parts = [];
      this.blobs = [];
      this.pending = 0;
      this.pos = 0;
      this.last = null;
      const mk = (kind, ts, cfg) => ({
        kind, ts, cfg, size: [], pts: [], dur: [], key: [], chunks: [], cur: null, desc: null, color: null,
      });
      this.v = mk('video', 90000, video);
      this.a = audio ? mk('audio', audio.sampleRate, audio) : null;
    }
    setVideoConfig(description, colorSpace) {
      if (description) this.v.desc = new Uint8Array(description.buffer ? description.buffer.slice(description.byteOffset, description.byteOffset + description.byteLength) : description);
      if (colorSpace) this.v.color = colorSpace;
    }
    setAudioConfig(description) {
      if (description && this.a) this.a.desc = new Uint8Array(description.buffer ? description.buffer.slice(description.byteOffset, description.byteOffset + description.byteLength) : description);
    }
    _add(tr, data, ptsUs, durUs, key) {
      if (this.last !== tr || tr.cur.n >= 64) {
        tr.cur = { off: this.pos, n: 0 };
        tr.chunks.push(tr.cur);
        this.last = tr;
      }
      tr.cur.n++;
      tr.size.push(data.length);
      tr.pts.push(Math.round((ptsUs * tr.ts) / 1e6));
      tr.dur.push(Math.max(1, Math.round((durUs * tr.ts) / 1e6)));
      tr.key.push(key ? 1 : 0);
      this.parts.push(data);
      this.pos += data.length;
      this.pending += data.length;
      if (this.pending > 32 * 1024 * 1024) {
        this.blobs.push(new Blob(this.parts));
        this.parts = [];
        this.pending = 0;
      }
    }
    addVideo(data, ptsUs, durUs, key) { this._add(this.v, data, ptsUs, durUs, key); }
    addAudio(data, ptsUs, durUs) { this._add(this.a, data, ptsUs, durUs, true); }
    get bytes() { return this.pos; }

    _timing(tr) {
      const n = tr.pts.length;
      let mono = true;
      for (let i = 1; i < n; i++) if (tr.pts[i] < tr.pts[i - 1]) { mono = false; break; }
      const dts = mono ? tr.pts : tr.pts.slice().sort((x, y) => x - y);
      let shift = 0;
      let cto = null;
      if (!mono) {
        cto = new Array(n);
        let min = 0;
        for (let i = 0; i < n; i++) { cto[i] = tr.pts[i] - dts[i]; if (cto[i] < min) min = cto[i]; }
        shift = -min;
        for (let i = 0; i < n; i++) cto[i] += shift;
      }
      const delta = new Array(n);
      for (let i = 0; i < n - 1; i++) delta[i] = Math.max(1, dts[i + 1] - dts[i]);
      if (n) delta[n - 1] = n > 1 && tr.kind === 'video' ? delta[n - 2] : tr.dur[n - 1];
      let total = 0;
      for (let i = 0; i < n; i++) total += delta[i];
      const first = n ? dts[0] : 0;
      return { delta, cto, shift, total, first };
    }

    _stsd(tr) {
      const c = tr.cfg;
      if (tr.kind === 'video') {
        const head = cat([
          zeros(6), u16(1), zeros(16), u16(c.width), u16(c.height), u32(0x480000), u32(0x480000),
          zeros(4), u16(1), zeros(32), u16(0x18), u16(0xffff),
        ]);
        let type, conf;
        if (c.codec === 'avc') { type = 'avc1'; conf = box('avcC', tr.desc || zeros(0)); }
        else if (c.codec === 'hevc') { type = 'hvc1'; conf = box('hvcC', tr.desc || zeros(0)); }
        else if (c.codec === 'vp9') {
          const m = /^vp09\.(\d+)\.(\d+)\.(\d+)/.exec(c.codecString || '') || [0, 0, 41, 8];
          const cs = tr.color || {};
          type = 'vp09';
          conf = full('vpcC', 1, 0, u8(+m[1], +m[2], (+m[3] << 4) | (1 << 1) | (cs.fullRange ? 1 : 0),
            PRIM[cs.primaries] || 1, TRC[cs.transfer] || 1, cs.matrix in MAT ? MAT[cs.matrix] : 1), u16(0));
        } else {
          const m = /^av01\.(\d)\.(\d+)([MH])\.(\d+)/.exec(c.codecString || '') || [0, 0, 9, 'M', 8];
          type = 'av01';
          conf = box('av1C', tr.desc && tr.desc.length >= 4 ? tr.desc
            : u8(0x81, (+m[1] << 5) | +m[2], ((m[3] === 'H' ? 1 : 0) << 7) | ((+m[4] > 8 ? 1 : 0) << 6) | 0x0c, 0));
        }
        const cs = tr.color;
        const colr = cs && cs.primaries
          ? box('colr', str('nclx'), u16(PRIM[cs.primaries] || 1), u16(TRC[cs.transfer] || 1),
              u16(cs.matrix in MAT ? MAT[cs.matrix] : 1), u8(cs.fullRange ? 0x80 : 0))
          : zeros(0);
        return full('stsd', 0, 0, u32(1), box(type, head, conf, colr));
      }
      const head = cat([zeros(6), u16(1), zeros(8), u16(c.channels), u16(16), zeros(4), u32((c.sampleRate & 0xffff) * 65536)]);
      if (c.codec === 'aac') {
        let asc = tr.desc;
        if (!asc || asc.length < 2) {
          const rates = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000];
          const idx = Math.max(0, rates.indexOf(c.sampleRate));
          asc = u8((2 << 3) | (idx >> 1), ((idx & 1) << 7) | (c.channels << 3));
        }
        const dsi = cat([u8(0x05, asc.length), asc]);
        const dcd = cat([u8(0x04, 13 + dsi.length, 0x40, 0x15, 0, 0, 0), u32(c.bitrate || 0), u32(c.bitrate || 0), dsi]);
        const sl = u8(0x06, 1, 2);
        const es = cat([u8(0x03, 3 + dcd.length + sl.length), u16(1), u8(0), dcd, sl]);
        return full('stsd', 0, 0, u32(1), box('mp4a', head, full('esds', 0, 0, es)));
      }
      let pre = 312, gain = 0, rate = c.sampleRate;
      const d = tr.desc;
      if (d && d.length >= 19 && d[0] === 0x4f && d[1] === 0x70) {
        pre = d[10] | (d[11] << 8);
        rate = (d[12] | (d[13] << 8) | (d[14] << 16) | (d[15] << 24)) >>> 0;
        gain = d[16] | (d[17] << 8);
      }
      tr.preSkip = pre;
      return full('stsd', 0, 0, u32(1), box('Opus', head, box('dOps', u8(0, c.channels), u16(pre), u32(rate), u16(gain), u8(0))));
    }

    _trak(tr, id, base, T) {
      const n = tr.size.length;
      const stsd = this._stsd(tr);
      // stts (run-length)
      const runs = [];
      for (let i = 0; i < n; i++) {
        const d = T.delta[i];
        if (runs.length && runs[runs.length - 1][1] === d) runs[runs.length - 1][0]++;
        else runs.push([1, d]);
      }
      const stts = full('stts', 0, 0, u32(runs.length), table(runs.length, 8, (dv, o, i) => { dv.setUint32(o, runs[i][0]); dv.setUint32(o + 4, runs[i][1]); }));
      let ctts = zeros(0);
      if (T.cto) {
        const cr = [];
        for (let i = 0; i < n; i++) {
          const d = T.cto[i];
          if (cr.length && cr[cr.length - 1][1] === d) cr[cr.length - 1][0]++;
          else cr.push([1, d]);
        }
        ctts = full('ctts', 0, 0, u32(cr.length), table(cr.length, 8, (dv, o, i) => { dv.setUint32(o, cr[i][0]); dv.setUint32(o + 4, cr[i][1]); }));
      }
      let stss = zeros(0);
      if (tr.kind === 'video') {
        const keys = [];
        for (let i = 0; i < n; i++) if (tr.key[i]) keys.push(i + 1);
        if (keys.length !== n) stss = full('stss', 0, 0, u32(keys.length), table(keys.length, 4, (dv, o, i) => dv.setUint32(o, keys[i])));
      }
      const sc = [];
      tr.chunks.forEach((c, i) => { if (!sc.length || sc[sc.length - 1][1] !== c.n) sc.push([i + 1, c.n]); });
      const stsc = full('stsc', 0, 0, u32(sc.length), table(sc.length, 12, (dv, o, i) => { dv.setUint32(o, sc[i][0]); dv.setUint32(o + 4, sc[i][1]); dv.setUint32(o + 8, 1); }));
      const stsz = full('stsz', 0, 0, u32(0), u32(n), table(n, 4, (dv, o, i) => dv.setUint32(o, tr.size[i])));
      const co64 = full('co64', 0, 0, u32(tr.chunks.length), table(tr.chunks.length, 8, (dv, o, i) => {
        const v = base + tr.chunks[i].off;
        dv.setUint32(o, Math.floor(v / 4294967296));
        dv.setUint32(o + 4, v % 4294967296);
      }));
      const stbl = box('stbl', stsd, stts, ctts, stss, stsc, stsz, co64);
      const isV = tr.kind === 'video';
      const minf = box('minf',
        isV ? full('vmhd', 0, 1, zeros(8)) : full('smhd', 0, 0, zeros(4)),
        box('dinf', full('dref', 0, 0, u32(1), full('url ', 0, 1))),
        stbl);
      const mdia = box('mdia',
        full('mdhd', 0, 0, u32(0), u32(0), u32(tr.ts), u32(T.total), u16(0x55c4), u16(0)),
        full('hdlr', 0, 0, u32(0), str(isV ? 'vide' : 'soun'), zeros(12), str(isV ? 'VideoHandler' : 'SoundHandler'), u8(0)),
        minf);
      const movDur = Math.round((T.total * 1000) / tr.ts);
      const mediaStart = T.shift + T.first + (tr.preSkip || 0);
      const edts = mediaStart > 0
        ? box('edts', full('elst', 0, 0, u32(1), u32(Math.max(1, movDur - Math.round(((tr.preSkip || 0) * 1000) / tr.ts))), u32(mediaStart), u16(1), u16(0)))
        : zeros(0);
      const tkhd = full('tkhd', 0, 3, u32(0), u32(0), u32(id), u32(0), u32(movDur), zeros(8), u16(0), u16(0),
        u16(isV ? 0 : 0x100), u16(0), MATRIX, u32(isV ? tr.cfg.width * 65536 : 0), u32(isV ? tr.cfg.height * 65536 : 0));
      return { trak: box('trak', tkhd, edts, mdia), movDur };
    }

    _moov(base) {
      const tracks = [this.v, this.a].filter((t) => t && t.size.length);
      let maxDur = 0;
      const traks = tracks.map((tr, i) => {
        if (!tr._T) tr._T = this._timing(tr);
        const r = this._trak(tr, i + 1, base, tr._T);
        maxDur = Math.max(maxDur, r.movDur);
        return r.trak;
      });
      const mvhd = full('mvhd', 0, 0, u32(0), u32(0), u32(1000), u32(maxDur), u32(0x10000), u16(0x100), zeros(10), MATRIX, zeros(24), u32(tracks.length + 1));
      let udta = zeros(0);
      const items = [];
      const tag = (code, text) => {
        if (text) items.push(box(u8(0xa9, ...str(code)), box('data', u32(1), u32(0), str(text))));
      };
      tag('nam', this.tags.title);
      tag('ART', this.tags.artist);
      tag('too', this.tags.tool);
      if (items.length) {
        udta = box('udta', full('meta', 0, 0,
          full('hdlr', 0, 0, u32(0), str('mdir'), str('appl'), zeros(9)),
          box('ilst', ...items)));
      }
      return box('moov', mvhd, ...traks, udta);
    }

    finalize() {
      if (this.parts.length) { this.blobs.push(new Blob(this.parts)); this.parts = []; }
      const brand = { avc: 'avc1', hevc: 'hvc1', vp9: 'vp09', av1: 'av01' }[this.v.cfg.codec];
      const ftyp = box('ftyp', str('isom'), u32(0x200), str('isom'), str('iso2'), str(brand), str('mp41'));
      const probe = this._moov(0);
      const base = ftyp.length + probe.length + 16;
      const moov = this._moov(base);
      const mdatHead = cat([u32(1), str('mdat'), u64(this.pos + 16)]);
      return new Blob([ftyp, moov, mdatHead, ...this.blobs], { type: 'video/mp4' });
    }
  }
  return Mux;
})();


/* ---------- Lyrics: TTML (line / word timing, agents, background vocals) and LRC ---------- */
const Lyrics = (() => {
  function parseTime(s, fr, tick) {
    if (s == null) return NaN;
    s = String(s).trim();
    if (!s) return NaN;
    let m = /^(\d+(?:\.\d+)?)(h|ms|m|s|f|t)$/.exec(s);
    if (m) {
      const v = +m[1];
      return { h: 3600 * v, m: 60 * v, s: v, ms: v / 1000, f: v / (fr || 30), t: v / (tick || 1) }[m[2]];
    }
    const parts = s.split(':');
    if (!parts.every((p) => /^\d+(\.\d+)?$/.test(p))) return NaN;
    if (parts.length === 4) return +parts[0] * 3600 + +parts[1] * 60 + +parts[2] + +parts[3] / (fr || 30);
    let t = 0;
    for (const p of parts) t = t * 60 + parseFloat(p);
    return t;
  }

  const attr = (el, name) => {
    if (!el.getAttribute) return null;
    let v = el.getAttribute(name);
    if (v == null && name.includes(':')) {
      const local = name.split(':')[1];
      for (const a of Array.from(el.attributes || [])) {
        if (a.localName === local || a.name.toLowerCase() === name.toLowerCase()) return a.value;
      }
    }
    return v;
  };
  const lname = (el) => (el.localName || el.nodeName || '').toLowerCase().replace(/^.*:/, '');

  function parseTTML(text) {
    let doc = new DOMParser().parseFromString(text, 'application/xml');
    if (doc.getElementsByTagName('parsererror').length || !doc.getElementsByTagName('*').length) {
      doc = new DOMParser().parseFromString(text, 'text/html');
    }
    const all = Array.from(doc.getElementsByTagName('*'));
    const root = all.find((e) => lname(e) === 'tt') || doc.documentElement;
    const fr = parseFloat(attr(root, 'ttp:frameRate')) || 30;
    const tick = parseFloat(attr(root, 'ttp:tickRate')) || 1;
    const T = (s) => parseTime(s, fr, tick);
    const ps = all.filter((e) => lname(e) === 'p');
    const lines = [];
    let wordTimed = 0;

    const pushText = (target, txt) => {
      if (/^\s/.test(txt) && target.length) target[target.length - 1].space = true;
      const words = txt.trim().split(/\s+/).filter(Boolean);
      words.forEach((w, i) => {
        target.push({ text: w, begin: NaN, end: NaN, space: i < words.length - 1 || /\s$/.test(txt) });
      });
    };
    const walk = (node, line, target) => {
      for (const ch of Array.from(node.childNodes)) {
        if (ch.nodeType === 3 || ch.nodeType === 4) {
          const txt = ch.nodeValue || '';
          if (!txt.trim()) {
            if (txt.length && target.length) target[target.length - 1].space = true;
            continue;
          }
          pushText(target, txt);
        } else if (ch.nodeType === 1) {
          const n = lname(ch);
          if (n === 'br') { if (target.length) target[target.length - 1].space = true; continue; }
          const role = attr(ch, 'ttm:role');
          if (role === 'x-bg') { walk(ch, line, line.bg); continue; }
          if (role === 'x-translation') { line.translation = (ch.textContent || '').trim(); continue; }
          if (role === 'x-roman') continue;
          const b = T(attr(ch, 'begin'));
          if (!isNaN(b)) {
            const raw = ch.textContent || '';
            if (!raw.trim()) { if (target.length) target[target.length - 1].space = true; continue; }
            let e = T(attr(ch, 'end'));
            const d = T(attr(ch, 'dur'));
            if (isNaN(e) && !isNaN(d)) e = b + d;
            if (/^\s/.test(raw) && target.length) target[target.length - 1].space = true;
            const words = raw.trim().split(/\s+/);
            const tot = words.reduce((s, w) => s + w.length, 0) || 1;
            let acc = 0;
            const en = isNaN(e) ? b + 0.3 : e;
            words.forEach((w, i) => {
              const b2 = b + ((en - b) * acc) / tot;
              acc += w.length;
              target.push({ text: w, begin: b2, end: b + ((en - b) * acc) / tot, space: i < words.length - 1 || /\s$/.test(raw) });
            });
            wordTimed++;
          } else walk(ch, line, target);
        }
      }
    };

    for (const p of ps) {
      const line = { begin: T(attr(p, 'begin')), end: T(attr(p, 'end')), agent: attr(p, 'ttm:agent') || '', words: [], bg: [], translation: '' };
      const d = T(attr(p, 'dur'));
      if (isNaN(line.end) && !isNaN(d) && !isNaN(line.begin)) line.end = line.begin + d;
      const par = p.parentNode;
      if (par && par.getAttribute) line.part = attr(par, 'itunes:song-part') || attr(par, 'itunes:songPart') || '';
      walk(p, line, line.words);
      if (line.words.length || line.bg.length) lines.push(line);
    }
    return finish(lines, wordTimed > 0);
  }

  function parseLRC(text) {
    const lines = [];
    const meta = {};
    let wordTimed = false;
    const ts = (m, s) => +m * 60 + parseFloat(s);
    for (const raw of text.split(/\r?\n/)) {
      const mm = /^\s*\[([a-zA-Z#]+):(.*)\]\s*$/.exec(raw);
      if (mm) { meta[mm[1].toLowerCase()] = mm[2].trim(); continue; }
      const stamps = [];
      let rest = raw;
      let m;
      while ((m = /^\s*\[(\d+):(\d+(?:[.:]\d+)?)\]/.exec(rest))) {
        stamps.push(ts(m[1], m[2].replace(':', '.')));
        rest = rest.slice(m[0].length);
      }
      if (!stamps.length) continue;
      const words = [];
      if (/<\d+:\d+(?:\.\d+)?>/.test(rest)) {
        wordTimed = true;
        const re = /<(\d+):(\d+(?:\.\d+)?)>([^<]*)/g;
        let w;
        while ((w = re.exec(rest))) {
          const txt = w[3];

      const f = Math.min(0.5, (size * 0.3) / Math.max(1, tk.w));
      const e = p * (1 + f) - f;
      g.addColorStop(clamp(e), rgba(sungCol, 1));
      g.addColorStop(clamp(e + f), rgba(E.C.text, unA));
      ctx.fillStyle = g;
    } else ctx.fillStyle = rgba(mix(E.C.text, sungCol, p), lerp(unA, 1, p));
    strokeFill(ctx, E, tk.text, x, y, size);
  }
  function rowX(B, align, w) {
    return align === 'left' ? B.x : align === 'right' ? B.x + B.w - w : B.x + (B.w - w) / 2;
  }
  function drawDots(ctx, E, cx, cy, size, it, t, alpha) {
    const p = clamp((t - it.begin) / Math.max(0.1, it.end - it.begin));
    const out = 1 - sstep(it.end - 0.45, it.end, t);
    const inn = sstep(it.begin, it.begin + 0.4, t);
    const r = size * 0.13;
    const br = 1 + 0.1 * Math.sin(t * 2.4) + E.sig.bass * 0.22;
    ctx.save();
    ctx.shadowColor = 'transparent';
    for (let i = 0; i < 3; i++) {
      ctx.globalAlpha = alpha * out * inn * (0.28 + 0.72 * clamp(p * 3 - i));
      ctx.fillStyle = rgba(E.C.text, 1);
      ctx.beginPath();
      ctx.arc(cx + (i - 1) * size * 0.46, cy, r * br * (0.4 + 0.6 * out), 0, TAU);
      ctx.fill();
    }
    ctx.restore();
  }

  /* ---- lyric styles ---- */
  function textBase(S, B, DW, DH) {
    const mn = Math.min(DW, DH);
    const st = S.text.style;
    const k = st === 'karaoke' ? 1.12 : st === 'line' ? 1.25 : 1;
    const tall = DH > DW * 1.15 ? 1.18 : 1;
    return mn * 0.062 * S.text.size * k * tall;
  }

  const spriteCache = new Map();
  let spriteSig = '';
  function lineSprite(E, li, j, level, align, base, blurPx, B) {
    const T = E.S.text, k = E.k;
    const sig = [layoutVersion, E.P.lyricsId, k.toFixed(4), T.style, T.font, T.weight, base.toFixed(1), B.w.toFixed(0), B.h.toFixed(0), E.C.text.join(','), E.C.dark.join(','),
      T.shadow, T.stroke, T.upper, T.spacing, T.lineHeight, T.showBg, T.showTr, T.inactiveBlur].join('|');
    if (sig !== spriteSig) { spriteCache.clear(); spriteSig = sig; }
    const key = j + '|' + level + '|' + align;
    let sp = spriteCache.get(key);
    if (sp) return sp;
    if (spriteCache.size >= 56) spriteCache.delete(spriteCache.keys().next().value);
    const pad = base * 0.5 + blurPx * 3;
    const w = Math.ceil((li.w + pad * 2) * k), h = Math.ceil((li.h + pad * 2) * k);
    const c = mk(w, h);
    const x = c.getContext('2d');
    x.setTransform(k, 0, 0, k, 0, 0);
    x.textBaseline = 'alphabetic';
    for (const row of li.rows) {
      setFont(x, T, row.size, row.tr ? Math.min(T.weight, 500) : 0);
      const rx = pad + (align === 'left' ? 0 : align === 'right' ? li.w - row.w : (li.w - row.w) / 2);
      x.globalAlpha = row.bg ? 0.75 : row.tr ? 0.62 : 1;
      styleShadow(x, E, row.size, 0);
      x.fillStyle = rgba(E.C.text, 1);
      strokeFill(x, E, row.text, rx, pad + row.base, row.size);
    }
    let out = c;
    if (level > 0 && HAS_FILTER) {
      out = mk(w, h);
      const o = out.getContext('2d');
      o.filter = `blur(${(blurPx * k).toFixed(2)}px)`;
      o.drawImage(c, 0, 0);
    }
    sp = { c: out, pad, w: w / k, h: h / k };
    spriteCache.set(key, sp);
    return sp;
  }

  function drawList(ctx, E, B, L, base, t) {
    const { S, P } = E;
    const T = S.text;
    const items = P.lyrics.items;
    const n = items.length;
    const lead = T.lead;
    const kar = T.style === 'karaoke';
    const before = kar ? 0 : T.before, after = kar ? 1 : T.after;
    const hl = T.highlight;
    const cont = (tt) => {
      const c = idxAt(items, tt + lead);
      if (c <= 0) return 0;
      const ts = items[c].begin - lead;
      const d = clamp(ts - (items[c - 1].begin - lead), 0.2, 0.8) * 0.9;
      return c - 1 + eOut4(clamp((tt - ts) / d));
    };
    const posAt = (f) => {
      const i = Math.floor(f);
      if (i >= n - 1) return L.pos[n - 1];
      return lerp(L.pos[i], L.pos[i + 1], f - i);
    };
    const cur = Math.max(0, idxAt(items, t + lead));
    const kc = cont(t);
    const anchorY = kar ? B.y + L.maxH / 2 + Math.max(0, B.h - L.ext) * clamp((T.anchor - 0.12) / 0.76) : B.y + B.h * T.anchor;
    const fadeH = kar ? base * 0.6 : B.h * 0.14;
    const j0 = Math.max(0, cur - before - 2), j1 = Math.min(n - 1, cur + after + 2);
    for (let j = j0; j <= j1; j++) {
      const it = items[j], li = L.items[j];
      const delay = T.stagger ? clamp(j - cur, 0, 8) * 0.035 : 0;
      const yc = anchorY + (L.pos[j] - posAt(cont(t - delay)));
      if (yc + li.h / 2 < B.y - base || yc - li.h / 2 > B.y + B.h + base) continue;
      const next = items[j + 1];
      const hold = next ? clamp(next.begin - lead, it.end, it.end + 0.7) : it.end + 0.7;
      const a = sstep(it.begin - lead - 0.03, it.begin - lead + 0.22, t) * (1 - sstep(hold, hold + 0.32, t));
      const dist = j - kc;
      const wf = dist < 0 ? clamp(before + 1 + dist) : clamp(after + 1 - dist);
      const ef = kar ? 1 : clamp((yc - li.h / 2 - B.y + base * 0.7) / fadeH) * clamp((B.y + B.h + base * 0.7 - (yc + li.h / 2)) / fadeH);
      const alpha = wf * ef * lerp(T.inactive, 1, a) * E.lyrA;
      if (alpha < 0.004) continue;
      const align = T.duet && it.alt ? (E.align === 'left' ? 'right' : E.align === 'right' ? 'left' : 'center') : E.align;
      if (it.gap) {
        if (a > 0.001) drawDots(ctx, E, align === 'left' ? B.x + base * 0.75 : align === 'right' ? B.x + B.w - base * 0.75 : B.x + B.w / 2, yc, base, it, t, a);
        continue;
      }
      const sc = lerp(T.inactiveScale, 1, a) * (1 + E.sig.kick * S.beat.textBounce * 0.05 * a);
      const ax = align === 'left' ? B.x : align === 'right' ? B.x + B.w : B.x + B.w / 2;
      ctx.save();
      ctx.translate(ax, yc);
      ctx.scale(sc, sc);
      ctx.translate(-ax, -yc);
      ctx.globalAlpha = alpha;
      // resting lines are cached sprites (blur is paid once, not per frame); the sung line is painted live
      const lvl = HAS_FILTER ? Math.round(Math.min(3, Math.abs(dist)) * 2) : 0;
      const blurPx = T.inactiveBlur * (lvl / 2) * base * 0.03;
      const live = blurPx * E.k > 0.4 ? sstep(0, 0.5, a) : a > 0.002 ? 1 : 0;
      const top = yc - li.h / 2;
      if (live < 1) {
        const sp = lineSprite(E, li, j, blurPx * E.k > 0.4 ? lvl : 0, align, base, blurPx, B);
        ctx.globalAlpha = wf * ef * T.inactive * E.lyrA * (1 - live);
        ctx.drawImage(sp.c, rowX(B, align, li.w) - sp.pad, top - sp.pad, sp.w, sp.h);
      }
      if (T.plate > 0 && a > 0.003) {
        const px = base * 0.42, py = base * 0.2;
        ctx.globalAlpha = wf * ef * E.lyrA * a * T.plate;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = rgba(mix([0, 0, 0], E.C.dark, 0.6), 0.72);
        ctx.beginPath();
        rr(ctx, rowX(B, align, li.w) - px, top - py, li.w + px * 2, li.h + py * 2, base * 0.3);
        ctx.fill();
      }
      if (live > 0) {
        const la = alpha * live;
        for (const row of li.rows) {
          setFont(ctx, T, row.size, row.tr ? Math.min(T.weight, 500) : 0);
          const x0 = rowX(B, align, row.w);
          const y = top + row.base;
          ctx.globalAlpha = la * (row.bg ? 0.75 : row.tr ? 0.62 : 1);
          if (row.tr) {
            styleShadow(ctx, E, row.size, 0);
            ctx.fillStyle = rgba(E.C.text, 1);
            strokeFill(ctx, E, row.text, x0, y, row.size);
          } else {
            for (const tk of row.toks) paintTok(ctx, E, tk, x0 + tk.x, y, row.size, a, t, hl);
          }
        }
      }
      ctx.restore();
    }
  }

  function drawSingle(ctx, E, B, L, base, t) {
    const { S, P } = E;
    const T = S.text;
    const items = P.lyrics.items;
    const lead = T.lead;
    const cur = idxAt(items, t + lead);
    if (cur < 0) return;
    const win = T.style === 'poster' ? (T.wordIn === 'all' ? 'pop' : T.wordIn) : T.wordIn;
    const yc = B.y + B.h * (T.style === 'poster' ? lerp(0.5, T.anchor, 0.5) : T.anchor);
    for (let j = Math.max(0, cur - 1); j <= cur; j++) {
      const it = items[j], li = L.items[j], next = items[j + 1];
      const exitAt = next ? Math.min(next.begin - lead - 0.02, it.end + 1.1) : it.end + 1.0;
      const ex = clamp((t - Math.max(exitAt, it.begin + 0.1)) / 0.3);
      if (ex >= 1) continue;
      const en = clamp((t - (it.begin - lead)) / 0.38);
      const align = T.duet && it.alt ? (E.align === 'left' ? 'right' : E.align === 'right' ? 'left' : 'center') : E.align;
      if (it.gap) { drawDots(ctx, E, B.x + B.w / 2, yc, base * 1.2, it, t, 1); continue; }
      let alpha = (1 - ex) * E.lyrA, dy = -eOut(ex) * base * 0.7, sc = 1 - ex * 0.04;
      if (win === 'all') { alpha *= clamp(en * 1.6); dy += (1 - eOut(en)) * base * 0.55; }
      sc *= 1 + E.sig.kick * S.beat.textBounce * 0.05;
      const ax = align === 'left' ? B.x : align === 'right' ? B.x + B.w : B.x + B.w / 2;
      ctx.save();
      ctx.translate(ax, yc + dy);
      ctx.scale(sc, sc);
      ctx.translate(-ax, -yc);
      const top = yc - li.h / 2;
      if (T.plate > 0) {
        const px = base * 0.42, py = base * 0.2;
        ctx.globalAlpha = alpha * T.plate * (win === 'all' ? 1 : clamp((t - it.begin + 0.1) / 0.25));
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = rgba(mix([0, 0, 0], E.C.dark, 0.6), 0.72);
        ctx.beginPath();
        rr(ctx, rowX(B, align, li.w) - px, top - py, li.w + px * 2, li.h + py * 2, base * 0.3);
        ctx.fill();
      }
      let caret = null;
      for (const row of li.rows) {
        setFont(ctx, T, row.size, row.tr ? Math.min(T.weight, 500) : 0);
        const x0 = rowX(B, align, row.w);
        const y = top + row.base;
        const ra = row.bg ? 0.75 : row.tr ? 0.62 : 1;
        if (row.tr) {
          ctx.globalAlpha = alpha * ra * clamp(en * 1.6);
          styleShadow(ctx, E, row.size, 0);
          ctx.fillStyle = rgba(E.C.text, 1);
          strokeFill(ctx, E, row.text, x0, y, row.size);
          continue;
        }
        for (const tk of row.toks) {
          const x = x0 + tk.x;
          if (win === 'all') { ctx.globalAlpha = alpha * ra; paintTok(ctx, E, tk, x, y, row.size, 1, t, T.highlight); continue; }
          const tb = win === 'type' ? tk.begin : tk.wb, te = win === 'type' ? tk.end : tk.we;
          const q = clamp((t - (tb - 0.05)) / 0.28);
          if (q <= 0) continue;
          const dur = Math.max(0.05, tk.end - tk.begin);
          const act = t < te ? 1 : 1 - clamp((t - te) / 0.35);
          const col = mix(E.C.text, E.C.sung, act);
          styleShadow(ctx, E, row.size, act * 0.9);
          ctx.fillStyle = rgba(col, 1);
          if (win === 'type') {
            const len = tk.text.length;
            const shown = Math.min(len, Math.ceil(clamp((t - tk.begin) / Math.min(dur, len * 0.07)) * len));
            if (shown <= 0) continue;
            ctx.globalAlpha = alpha * ra;
            const sub = tk.text.slice(0, shown);
            strokeFill(ctx, E, sub, x, y, row.size);
            if (!row.bg) caret = { x: x + (shown >= len ? tk.w : ctx.measureText(sub).width), y, size: row.size };
            continue;
          }
          let ty = 0, ts = 1, ta = 1;
          if (win === 'pop') { ts = lerp(0.45, 1, backOut(q)); ta = clamp(q * 3); ty = (1 - eOut(q)) * row.size * 0.22; }
          else if (win === 'rise') { ta = clamp(q * 1.5); ty = (1 - eOut4(q)) * row.size * 0.7; }
          else { ta = q; ts = lerp(1.08, 1, eOut(q)); }
          ctx.globalAlpha = alpha * ra * ta;
          if (ts !== 1) {
            const cx = x0 + tk.wx + tk.ww / 2, cy = y - row.size * 0.3;
            ctx.save();
            ctx.translate(cx, cy + ty);
            ctx.scale(ts, ts);
            ctx.translate(-cx, -cy);
            strokeFill(ctx, E, tk.text, x, y, row.size);
            ctx.restore();
          } else strokeFill(ctx, E, tk.text, x, y + ty, row.size);
        }
      }
      if (caret && ex === 0 && Math.floor(t * 2.6) % 2 === 0) {
        ctx.globalAlpha = alpha;
        ctx.shadowColor = 'transparent';
        ctx.fillStyle = rgba(E.C.sung, 1);
        ctx.fillRect(caret.x + caret.size * 0.06, caret.y - caret.size * 0.78, caret.size * 0.07, caret.size * 0.95);
      }
      ctx.restore();
    }
  }

  function drawWord(ctx, E, B, L, base, t) {
    const T = E.S.text;
    const ws = L.words;
    const cur = idxAt(ws, t + 0.03);
    if (cur < 0) return;
    const cx = E.align === 'left' ? B.x : E.align === 'right' ? B.x + B.w : B.x + B.w / 2;
    const cy = B.y + B.h * lerp(0.5, T.anchor, 0.5);
    ctx.textAlign = E.align === 'auto' ? 'center' : E.align;
    for (let j = Math.max(0, cur - 1); j <= cur; j++) {
      const w = ws[j], next = ws[j + 1];
      const until = next ? Math.min(next.begin, w.lineEnd + 0.9) : w.lineEnd + 0.9;
      setFont(ctx, T, 100);
      const w100 = Math.max(1, ctx.measureText(w.text).width);
      const size = Math.min((B.w / w100) * 100, base * 4.2, B.h * 0.55);
      setFont(ctx, T, size);
      const q = clamp((t - w.begin) / 0.2);
      const ex = clamp((t - until) / 0.22);
      if (ex >= 1) continue;
      const sc = (1.32 - 0.32 * eOut4(q)) * (1 + ex * 0.3) * (1 + E.sig.kick * E.S.beat.textBounce * 0.06);
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate((hash(j, 3) - 0.5) * 0.07);
      ctx.scale(sc, sc);
      ctx.globalAlpha = clamp(q * 4) * (1 - ex) * (j === cur ? 1 : 0.55) * E.lyrA;
      styleShadow(ctx, E, size, 1 - ex);
      ctx.fillStyle = rgba(E.C.sung, 1);
      strokeFill(ctx, E, w.text, 0, size * 0.345, size);
      ctx.restore();
    }
    ctx.textAlign = 'left';
  }

  function drawLyrics(ctx, E, B, t, DW, DH) {
    const { P, S } = E;
    if (!P.lyrics || !P.lyrics.items.length) return;
    const L = getLayout(ctx, P, S, textBase(S, B, DW, DH), B);
    const base = L.base;
    ctx.save();
    ctx.textBaseline = 'alphabetic';
    ctx.textAlign = 'left';
    const st = S.text.style;
    if (st === 'word') drawWord(ctx, E, B, L, base, t);
    else if (st === 'line' || st === 'poster') drawSingle(ctx, E, B, L, base, t);
    else drawList(ctx, E, B, L, base, t);
    ctx.restore();
  }

  /* ---- backgrounds ---- */
  const blurCache = new Map();
  function blurred(img, amt, sat, id) {
    const key = id + '|' + amt.toFixed(2) + '|' + sat.toFixed(2);
    let c = blurCache.get(key);
    if (c) return c;
    if (blurCache.size > 4) blurCache.clear();
    const OUT = amt < 0.08 ? 1280 : 512;
    const small = amt < 0.08 ? OUT : Math.max(6, Math.round(8 * Math.pow(64, 1 - amt)));
    let cur = mk(small, small);
    let x = cur.getContext('2d');
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, 0, 0, small, small);
    let sz = small;
    while (sz < OUT) {
      sz = Math.min(OUT, sz * 3);
      const nx = mk(sz, sz);
      const nc = nx.getContext('2d');
      nc.imageSmoothingQuality = 'high';
      nc.drawImage(cur, 0, 0, sz, sz);
      cur = nx;
    }
    c = mk(OUT, OUT);
    x = c.getContext('2d');
    if (HAS_FILTER) x.filter = `blur(${(OUT * 0.035 * amt).toFixed(1)}px) saturate(${sat.toFixed(2)})`;
    const pad = OUT * 0.09 * amt;
    x.drawImage(cur, -pad, -pad, OUT + pad * 2, OUT + pad * 2);
    blurCache.set(key, c);
    return c;
  }
  function drawBg(ctx, E, DW, DH, t) {
    const { S, P, C, sig } = E;
    const G = S.bg;
    const ox = DW * 0.05, oy = DH * 0.05;
    const mt = (t * 0.55 + sig.cr * 1.3) * G.speed;
    const pulse = sig.drive * S.beat.bgPulse;
    ctx.fillStyle = rgba(C.dark, 1);
    ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
    if (G.style === 'cover') {
      const src = G.source === 'image' && P.bgImage ? P.bgImage : P.coverSq;
      if (src) {
        const img = blurred(src, G.blur, G.sat, G.source === 'image' && P.bgImage ? P.bgId : P.coverId);
        const ang = Math.sin(mt * 0.11) * 0.3 * Math.min(1, G.blur * 2) + (G.blur > 0.5 ? mt * 0.02 : 0);
        const ca = Math.abs(Math.cos(ang)), sa = Math.abs(Math.sin(ang));
        const side = Math.max(DW * ca + DH * sa, DW * sa + DH * ca) * (1.12 + pulse * 0.07);
        ctx.save();
        ctx.translate(DW / 2 + Math.sin(mt * 0.23) * DW * 0.025, DH / 2 + Math.cos(mt * 0.19) * DH * 0.025);
        ctx.rotate(ang);
        ctx.imageSmoothingQuality = 'high';
        ctx.drawImage(img, -side / 2, -side / 2, side, side);
        ctx.restore();
      }
    } else if (G.style === 'fluid') {
      const R = Math.max(DW, DH);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      C.colors.slice(0, 5).forEach((col, i) => {
        const x = DW * (0.5 + 0.46 * Math.sin(mt * (0.21 + i * 0.047) + i * 2.1));
        const y = DH * (0.5 + 0.46 * Math.cos(mt * (0.17 + i * 0.061) + i * 1.3));
        const r = R * (0.42 + 0.1 * Math.sin(mt * 0.3 + i)) * (1 + pulse * 0.22);
        const g = ctx.createRadialGradient(x, y, 0, x, y, r);
        g.addColorStop(0, rgba(col, 0.85));
        g.addColorStop(0.55, rgba(col, 0.32));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      });
      ctx.restore();
    } else if (G.style === 'gradient') {
      const ang = mt * 0.12 + 0.7;
      const r = Math.hypot(DW, DH) / 2;
      const g = ctx.createLinearGradient(DW / 2 - Math.cos(ang) * r, DH / 2 - Math.sin(ang) * r, DW / 2 + Math.cos(ang) * r, DH / 2 + Math.sin(ang) * r);
      g.addColorStop(0, rgba(C.dark, 1));
      g.addColorStop(clamp(0.5 + 0.12 * Math.sin(mt * 0.4)), rgba(mix(C.colors[0], C.dark, 0.25 - pulse * 0.2), 1));
      g.addColorStop(1, rgba(mix(C.colors[1] || C.accent, C.dark, 0.15), 1));
      ctx.fillStyle = g;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
    } else if (G.style === 'solid') {
      ctx.fillStyle = G.color === 'auto' ? rgba(C.dark, 1) : G.colorCustom;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      const r = Math.max(DW, DH) * (0.5 + pulse * 0.12);
      const g = ctx.createRadialGradient(DW / 2, DH * 0.55, 0, DW / 2, DH * 0.55, r);
      g.addColorStop(0, rgba(C.accent, 0.16 + pulse * 0.14));
      g.addColorStop(1, rgba(C.accent, 0));
      ctx.fillStyle = g;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
    } else if (G.style === 'grid') {
      const hz = DH * 0.6;
      const sky = ctx.createLinearGradient(0, -oy, 0, hz);
      sky.addColorStop(0, rgba(C.dark, 1));
      sky.addColorStop(1, rgba(mix(C.dark, C.colors[0], 0.55), 1));
      ctx.fillStyle = sky;
      ctx.fillRect(-ox, -oy, DW + ox * 2, hz + oy);
      const sr = Math.min(DW, DH) * 0.24 * (1 + pulse * 0.07);
      const sy = hz - sr * 0.35;
      ctx.save();
      ctx.beginPath();
      ctx.rect(-ox, -oy, DW + ox * 2, hz + oy);
      ctx.clip();
      const sg = ctx.createLinearGradient(0, sy - sr, 0, sy + sr);
      sg.addColorStop(0, rgba(mix(C.accent, [255, 255, 255], 0.35), 1));
      sg.addColorStop(1, rgba(C.colors[1] || C.accent, 1));
      ctx.fillStyle = sg;
      ctx.shadowColor = rgba(C.accent, 0.6);
      ctx.shadowBlur = sr * 0.5 * E.k;
      ctx.beginPath();
      ctx.arc(DW / 2, sy, sr, 0, TAU);
      ctx.fill();
      ctx.shadowColor = 'transparent';
      ctx.beginPath();
      ctx.arc(DW / 2, sy, sr, 0, TAU);
      ctx.clip();
      ctx.fillStyle = rgba(mix(C.dark, C.colors[0], 0.55), 1);
      for (let i = 0; i < 6; i++) {
        const yy = sy + sr * (0.08 + i * 0.16);
        ctx.fillRect(DW / 2 - sr * 1.1, yy, sr * 2.2, sr * (0.025 + i * 0.014));
      }
      ctx.restore();
      ctx.fillStyle = rgba(C.dark, 1);
      ctx.fillRect(-ox, hz, DW + ox * 2, DH - hz + oy);
      ctx.save();
      ctx.beginPath();
      ctx.rect(-ox, hz, DW + ox * 2, DH - hz + oy);
      ctx.clip();
      ctx.strokeStyle = rgba(C.accent, 0.75);
      ctx.lineWidth = 2.2;
      ctx.shadowColor = rgba(C.accent, 0.9);
      ctx.shadowBlur = (8 + pulse * 14) * E.k;
      ctx.beginPath();
      for (let i = -18; i <= 18; i++) {
        ctx.moveTo(DW / 2 + i * DW * 0.018, hz);
        ctx.lineTo(DW / 2 + i * DW * 0.2, DH + oy);
      }
      const ph = (mt * 0.9) % 1;
      for (let j = 0; j < 14; j++) {
        const d = (j + ph) / 14;
        const yy = hz + (DH + oy - hz) * Math.pow(d, 2.4);
        ctx.moveTo(-ox, yy);
        ctx.lineTo(DW + ox, yy);
      }
      ctx.stroke();
      ctx.restore();
      const hg = ctx.createLinearGradient(0, hz - DH * 0.06, 0, hz + DH * 0.1);
      hg.addColorStop(0, rgba(C.accent, 0));
      hg.addColorStop(0.4, rgba(C.accent, 0.28 + pulse * 0.3));
      hg.addColorStop(1, rgba(C.accent, 0));
      ctx.fillStyle = hg;
      ctx.fillRect(-ox, hz - DH * 0.06, DW + ox * 2, DH * 0.16);
    }
    else if (G.style === 'aurora') {
      const sky = ctx.createLinearGradient(0, -oy, 0, DH + oy);
      sky.addColorStop(0, rgba(C.dark, 1));
      sky.addColorStop(1, rgba(mix(C.dark, C.colors[0], 0.4), 1));
      ctx.fillStyle = sky;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      const steps = 28;
      for (let b = 0; b < 4; b++) {
        const col = C.colors[b % C.colors.length];
        const hh = DH * (0.34 + 0.1 * Math.sin(mt * 0.4 + b)) * (1 + pulse * 0.3);
        const top = (x) => DH * (0.12 + 0.13 * b) + Math.sin((x / DW) * 3.1 + mt * (0.5 + b * 0.13) + b * 1.9) * DH * 0.08 + Math.sin((x / DW) * 7.3 - mt * 0.33 + b * 2.6) * DH * 0.035;
        ctx.beginPath();
        for (let i = 0; i <= steps; i++) { const x = -ox + ((DW + ox * 2) * i) / steps; if (i) ctx.lineTo(x, top(x)); else ctx.moveTo(x, top(x)); }
        for (let i = steps; i >= 0; i--) { const x = -ox + ((DW + ox * 2) * i) / steps; ctx.lineTo(x, top(x) + hh * (0.8 + 0.2 * Math.sin((x / DW) * 5 + mt + b))); }
        ctx.closePath();
        const y0 = DH * (0.12 + 0.13 * b) - DH * 0.12;
        const g = ctx.createLinearGradient(0, y0, 0, y0 + hh + DH * 0.24);
        g.addColorStop(0, rgba(col, 0));
        g.addColorStop(0.5, rgba(mix(col, [255, 255, 255], 0.1), 0.42 + pulse * 0.15));
        g.addColorStop(0.8, rgba(mix(col, [255, 255, 255], 0.4), 0.85 + pulse * 0.15));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.fill();
      }
      ctx.restore();
    } else if (G.style === 'tunnel') {
      const cx = DW / 2 + Math.sin(mt * 0.31) * DW * 0.04, cy = DH / 2 + Math.cos(mt * 0.27) * DH * 0.04;
      const R = Math.hypot(DW, DH) * 0.62;
      const bgG = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
      bgG.addColorStop(0, rgba(mix(C.dark, C.colors[0], 0.5 + pulse * 0.2), 1));
      bgG.addColorStop(1, rgba(C.dark, 1));
      ctx.fillStyle = bgG;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      const sides = { circle: 0, tri: 3, square: 4, hex: 6 }[G.shape] || 0;
      const n = 16, ph = (mt * 0.45) % 1;
      ctx.save();
      ctx.lineJoin = 'round';
      for (let i = 0; i < n; i++) {
        const d = (i + ph) / n;
        const r = R * (0.02 + 1.15 * Math.pow(d, 2.3));
        const col = mix(C.colors[i % C.colors.length], C.accent, 0.35);
        const al = clamp(d * 5) * (0.35 + 0.5 * d + pulse * 0.25), lw = (1.5 + d * 12) * (1 + pulse * 0.6);
        ctx.beginPath();
        if (!sides) ctx.arc(cx, cy, r, 0, TAU);
        else {
          const rot = mt * 0.18 + i * 0.11;
          for (let v = 0; v <= sides; v++) {
            const a = rot + (v / sides) * TAU;
            if (v) ctx.lineTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r); else ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
          }
          ctx.closePath();
        }
        // glow as a wide soft stroke under a thin bright one (far cheaper than a blur per ring)
        ctx.strokeStyle = rgba(col, al * 0.22);
        ctx.lineWidth = lw * 3.4;
        ctx.stroke();
        ctx.strokeStyle = rgba(mix(col, [255, 255, 255], 0.25), al);
        ctx.lineWidth = lw;
        ctx.stroke();
      }
      ctx.restore();
    } else if (G.style === 'waves') {
      const sky = ctx.createLinearGradient(0, -oy, 0, DH * 0.7);
      sky.addColorStop(0, rgba(mix(C.dark, C.colors[1] || C.accent, 0.35), 1));
      sky.addColorStop(1, rgba(mix(C.dark, C.colors[0], 0.7), 1));
      ctx.fillStyle = sky;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      const sunR = Math.min(DW, DH) * 0.16 * (1 + pulse * 0.08);
      const sg = ctx.createRadialGradient(DW * 0.68, DH * 0.3, sunR * 0.2, DW * 0.68, DH * 0.3, sunR * 2.6);
      sg.addColorStop(0, rgba(mix(C.accent, [255, 255, 255], 0.5), 0.85));
      sg.addColorStop(0.38, rgba(C.accent, 0.35));
      sg.addColorStop(1, rgba(C.accent, 0));
      ctx.fillStyle = sg;
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      const Ln = 6, steps = 36;
      for (let l = 0; l < Ln; l++) {
        const baseY = DH * (0.42 + 0.105 * l);
        const amp = DH * (0.035 + 0.01 * l) * (1 + pulse * 0.7 * ((l + 1) / Ln));
        ctx.beginPath();
        ctx.moveTo(-ox, DH + oy);
        for (let i = 0; i <= steps; i++) {
          const x = -ox + ((DW + ox * 2) * i) / steps, u = x / DW;
          ctx.lineTo(x, baseY + Math.sin(u * TAU * (1.05 + 0.22 * l) + mt * (0.45 + 0.17 * l) + l * 1.7) * amp + Math.sin(u * TAU * 2.9 - mt * 0.4 + l) * amp * 0.35);
        }
        ctx.lineTo(DW + ox, DH + oy);
        ctx.closePath();
        ctx.fillStyle = rgba(mix(C.colors[l % C.colors.length], C.dark, 0.25 + 0.12 * l), 0.92);
        ctx.fill();
      }
    } else if (G.style === 'dots') {
      const mn = Math.min(DW, DH);
      const cell = mn / 20;
      const cols = Math.ceil(DW / cell), rows = Math.ceil(DH / cell);
      const x0 = (DW - cols * cell) / 2 + cell / 2, y0 = DH - cell / 2 - (rows * cell - DH) / 2;
      const A = P.A;
      const off = new Path2D(), on = [new Path2D(), new Path2D(), new Path2D()];
      for (let c = 0; c < cols; c++) {
        const u = Math.abs((c + 0.5) / cols - 0.5) * 2;
        let v = 0.15 + 0.1 * Math.sin(mt + c * 0.5);
        if (A) { const fb = u * (A.NB - 8), b0 = Math.floor(fb); v = lerp(specAt(A, t, b0), specAt(A, t, Math.min(A.NB - 1, b0 + 1)), fb - b0); }
        const lit = v * rows * 0.78;
        for (let r = 0; r < rows; r++) {
          const x = x0 + c * cell, y = y0 - r * cell;
          const f = clamp(lit - r);
          if (f > 0.02) { const pth = on[r < rows * 0.3 ? 0 : r < rows * 0.55 ? 1 : 2]; pth.moveTo(x + cell * 0.36, y); pth.arc(x, y, cell * (0.12 + 0.24 * f), 0, TAU); }
          else { off.moveTo(x + cell * 0.1, y); off.arc(x, y, cell * 0.1, 0, TAU); }
        }
      }
      ctx.fillStyle = rgba(C.text, 0.07);
      ctx.fill(off);
      on.forEach((pth, i) => { ctx.fillStyle = rgba(i === 0 ? C.colors[0] : i === 1 ? mix(C.colors[0], C.accent, 0.6) : mix(C.accent, [255, 255, 255], 0.35), 0.9); ctx.fill(pth); });
    } else if (G.style === 'kaleido') {
      const src = G.source === 'image' && P.bgImage ? P.bgImage : P.coverSq;
      if (src) {
        const img = blurred(src, G.blur * 0.45, G.sat, (G.source === 'image' && P.bgImage ? P.bgId : P.coverId) + 'k');
        const n = Math.max(3, Math.round(G.segments)) * 2;
        const a = TAU / n, R = Math.hypot(DW, DH) * 0.56;
        // the picture sits along each wedge, so real detail of the cover shows instead of one flat patch
        const Sz = R * (a > 0.7 ? 2.1 : 1.5) * (1 + pulse * 0.06);
        const dxi = R * 0.5 + Math.sin(mt * 0.21) * R * 0.1, dyi = Math.cos(mt * 0.17) * R * 0.08;
        ctx.imageSmoothingQuality = 'high';
        for (let i = 0; i < n; i++) {
          ctx.save();
          ctx.translate(DW / 2, DH / 2);
          if (i % 2) { ctx.rotate(mt * 0.05 + (i + 1) * a); ctx.scale(1, -1); } else ctx.rotate(mt * 0.05 + i * a);
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(R, -1.5);
          ctx.lineTo(R * Math.cos(a) + 2, R * Math.sin(a) + 2);
          ctx.closePath();
          ctx.clip();
          ctx.drawImage(img, -Sz / 2 + dxi, -Sz / 2 + dyi, Sz, Sz);
          ctx.restore();
        }
      }
    }
    if (G.tint > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'color';
      ctx.fillStyle = rgba(hex2rgb(G.tintColor), G.tint);
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      ctx.restore();
    }
    if (G.dim > 0) {
      ctx.fillStyle = rgba(mix([0, 0, 0], C.dark, 0.5), G.dim);
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
    }
    const fl = sig.kick * S.beat.flash;
    if (fl > 0.01) {
      ctx.save();
      ctx.globalCompositeOperation = 'screen';
      ctx.fillStyle = rgba(mix(C.accent, [255, 255, 255], 0.5), fl * 0.38);
      ctx.fillRect(-ox, -oy, DW + ox * 2, DH + oy * 2);
      ctx.restore();
    }
  }

  /* ---- visualiser ---- */
  function specAt(A, t, b) {
    const x = clamp(t * A.AF, 0, A.n - 1.001);
    const i = Math.floor(x), f = x - i;
    return (A.spec[i * A.NB + b] * (1 - f) + A.spec[(i + 1) * A.NB + b] * f) / 255;
  }
  function drawViz(ctx, E, DW, DH, t, lay) {
    const { S, P, C } = E;
    const B = S.beat;
    const A = P.A;
    if (B.viz === 'none' || !A) return;
    const col = B.vizColor === 'text' ? C.text : C.accent;
    const NBn = A.NB;
    const amp = B.vizSize;
    ctx.save();
    ctx.globalAlpha = B.vizOpacity;
    if (B.viz === 'bars' || B.viz === 'mirror') {
      const count = DW > DH ? 64 : 36;
      const bw = DW / count;
      const maxH = DH * (B.viz === 'mirror' ? 0.3 : 0.36) * amp;
      const topBars = B.viz === 'bars' && B.vizPos === 'top';
      const yb = B.viz === 'mirror' ? DH / 2 : topBars ? 0 : DH;
      const g = topBars ? ctx.createLinearGradient(0, 0, 0, maxH) : ctx.createLinearGradient(0, yb - maxH, 0, yb + (B.viz === 'mirror' ? maxH : 0));
      if (B.viz === 'mirror') { g.addColorStop(0, rgba(col, 0.1)); g.addColorStop(0.5, rgba(col, 0.9)); g.addColorStop(1, rgba(col, 0.1)); }
      else if (topBars) { g.addColorStop(0, rgba(col, 0.95)); g.addColorStop(1, rgba(col, 0.15)); }
      else { g.addColorStop(0, rgba(col, 0.15)); g.addColorStop(1, rgba(col, 0.95)); }
      ctx.fillStyle = g;
      ctx.beginPath();
      for (let i = 0; i < count; i++) {
        const fb = (i / (count - 1)) * (NBn - 5);
        const b0 = Math.floor(fb);
        const v = lerp(specAt(A, t, b0), specAt(A, t, Math.min(NBn - 1, b0 + 1)), fb - b0);
        const h = Math.max(bw * 0.25, v * maxH);
        const x = i * bw + bw * 0.19, w = bw * 0.62;
        if (B.viz === 'mirror') rr(ctx, x, yb - h, w, h * 2, w / 2);
        else if (topBars) rr(ctx, x, -w, w, h + w, w / 2);
        else rr(ctx, x, yb - h, w, h + w, w / 2);
      }
      ctx.fill();
    } else if (B.viz === 'ring') {
      const cv = lay.cover;
      const cx = cv ? cv.cx : DW / 2, cy = cv ? cv.cy : DH / 2;
      const round = S.frame.coverShape === 'circle' || S.frame.coverShape === 'vinyl';
      const cs = cv ? cv.size * (1 + E.sig.drive * S.beat.coverPulse * 0.07) : Math.min(DW, DH) * 0.3;
      const r0 = cs * (round ? 0.54 : 0.76);
      const count = 120;
      const maxH = cs * 0.34 * amp;
      ctx.strokeStyle = rgba(col, 0.9);
      ctx.lineCap = 'round';
      ctx.lineWidth = Math.max(2, (TAU * r0) / count * 0.5);
      ctx.beginPath();
      for (let i = 0; i < count; i++) {
        const u = i / count;
        const m = u < 0.5 ? u * 2 : (1 - u) * 2;
        const fb = m * (NBn - 6);
        const b0 = Math.floor(fb);
        const v = lerp(specAt(A, t, b0), specAt(A, t, Math.min(NBn - 1, b0 + 1)), fb - b0);
        const a = u * TAU + Math.PI / 2;
        const r1 = r0 + ctx.lineWidth * 0.2 + v * maxH;
        ctx.moveTo(cx + Math.cos(a) * r0, cy + Math.sin(a) * r0);
        ctx.lineTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      }
      ctx.stroke();
    } else if (B.viz === 'wave') {
      const maxH = DH * 0.3 * amp;
      for (let layer = 0; layer < 2; layer++) {
        const tt = t - layer * 0.09;
        const pts = 28;
        ctx.beginPath();
        ctx.moveTo(0, DH + 4);
        let px = 0, py = DH - specAt(A, tt, 0) * maxH * (layer ? 1.25 : 1);
        ctx.lineTo(px, py);
        for (let i = 1; i <= pts; i++) {
          const x = (i / pts) * DW;
          const fb = (i / pts) * (NBn - 6);
          const b0 = Math.floor(fb);
          const v = lerp(specAt(A, tt, b0), specAt(A, tt, Math.min(NBn - 1, b0 + 1)), fb - b0);
          const y = DH - (DH * 0.012 + v * maxH * (layer ? 1.25 : 1));
          ctx.quadraticCurveTo(px, py, (px + x) / 2, (py + y) / 2);
          px = x; py = y;
        }
        ctx.lineTo(DW, py);
        ctx.lineTo(DW, DH + 4);
        ctx.closePath();
        const g = ctx.createLinearGradient(0, DH - maxH * 1.25, 0, DH);
        g.addColorStop(0, rgba(col, layer ? 0.12 : 0.3));
        g.addColorStop(1, rgba(col, layer ? 0.3 : 0.75));
        ctx.fillStyle = g;
        ctx.fill();
      }
    } else if (B.viz === 'scope') {
      const cy = B.vizPos === 'center' ? DH / 2 : B.vizPos === 'top' ? DH * 0.12 : DH * 0.88;
      const span = Math.round(A.sr * 0.03);
      const s0 = Math.round(t * A.sr) - (span >> 1);
      const pts = 220;
      const h = DH * 0.16 * amp;
      ctx.strokeStyle = rgba(col, 0.95);
      ctx.lineWidth = 4;
      ctx.lineJoin = 'round';
      ctx.shadowColor = rgba(col, 0.8);
      ctx.shadowBlur = 14 * E.k;
      ctx.beginPath();
      for (let i = 0; i <= pts; i++) {
        const si = s0 + Math.round((i / pts) * span);
        const v = si >= 0 && si < A.mono.length ? A.mono[si] : 0;
        const edge = Math.sin((i / pts) * Math.PI);
        const x = (i / pts) * DW, y = cy + clamp(v * 1.6, -1, 1) * h * edge;
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    ctx.restore();
  }

  /* ---- particles (stateless: positions are functions of time) ---- */
  function drawParticles(ctx, E, DW, DH, t, lay) {
    const { S, P, C, sig } = E;
    const B = S.beat;
    if (B.particles === 'none') return;
    const mt = t * 0.6 + sig.cr * 2.4 * B.partReact;
    const mn = Math.min(DW, DH);
    const area = (DW * DH) / (1920 * 1080);
    ctx.save();
    if (B.particles === 'dust' || B.particles === 'snow') {
      const n = Math.round(160 * B.partAmount * Math.sqrt(area)) + 8;
      const dir = B.particles === 'snow' ? 1 : -1;
      ctx.fillStyle = rgba(B.partColor === 'accent' ? C.accent : B.partColor === 'text' ? C.text : mix(C.text, C.accent, 0.25), 1);
      for (let i = 0; i < n; i++) {
        const sp = 0.02 + hash(i, 1) * 0.05;
        let y = (hash(i, 2) + dir * mt * sp) % 1;
        if (y < 0) y += 1;
        const x = hash(i, 3) + Math.sin(mt * (0.3 + hash(i, 4)) + i) * 0.015;
        const r = mn * (0.0012 + hash(i, 5) * 0.003) * (B.particles === 'snow' ? 1.5 : 1);
        ctx.globalAlpha = (0.15 + 0.55 * hash(i, 6)) * (0.6 + 0.4 * Math.sin(mt * 2 + i * 1.7)) * Math.sin(y * Math.PI) * (0.7 + sig.high * 0.6 * B.partReact);
        ctx.beginPath();
        ctx.arc(x * DW, y * DH, r, 0, TAU);
        ctx.fill();
      }
    } else if (B.particles === 'bokeh') {
      const n = Math.round(26 * B.partAmount) + 4;
      ctx.globalCompositeOperation = 'screen';
      for (let i = 0; i < n; i++) {
        const sp = 0.008 + hash(i, 1) * 0.02;
        let y = (hash(i, 2) - mt * sp) % 1;
        if (y < 0) y += 1;
        const x = hash(i, 3) + Math.sin(mt * 0.2 + i) * 0.03;
        const r = mn * (0.025 + hash(i, 5) * 0.07) * (1 + sig.bass * 0.3 * B.partReact);
        const col = C.colors[i % C.colors.length];
        const g = ctx.createRadialGradient(x * DW, y * DH, r * 0.2, x * DW, y * DH, r);
        const a = (0.08 + 0.16 * hash(i, 6)) * Math.sin(y * Math.PI);
        g.addColorStop(0, rgba(mix(col, [255, 255, 255], 0.35), a));
        g.addColorStop(0.85, rgba(col, a * 0.8));
        g.addColorStop(1, rgba(col, 0));
        ctx.fillStyle = g;
        ctx.fillRect(x * DW - r, y * DH - r, r * 2, r * 2);
      }
    } else if (B.particles === 'stars') {
      const n = Math.round(220 * B.partAmount) + 20;
      const cx = DW / 2, cy = DH / 2, R = Math.hypot(DW, DH) / 2;
      ctx.strokeStyle = rgba(B.partColor === 'accent' ? C.accent : C.text, 1);
      ctx.lineCap = 'round';
      for (let i = 0; i < n; i++) {
        const a = hash(i, 1) * TAU;
        const z = (hash(i, 2) + mt * (0.06 + hash(i, 3) * 0.08)) % 1;
        const r = z * z * R * 1.05 + mn * 0.02;
        const len = (4 + z * 26 + sig.kick * 60 * B.partReact * z) * (mn / 1080);
        ctx.globalAlpha = clamp(z * 1.8) * (0.25 + 0.6 * hash(i, 4));
        ctx.lineWidth = (0.8 + z * 2.2) * (mn / 1080);
        ctx.beginPath();
        ctx.moveTo(cx + Math.cos(a) * r, cy + Math.sin(a) * r);
        ctx.lineTo(cx + Math.cos(a) * (r + len), cy + Math.sin(a) * (r + len));
        ctx.stroke();
      }
    } else if (B.particles === 'sparks' && P.A) {
      const ons = P.A.onsets;
      const thr = (1 - B.sens) * 0.75;
      const cv = lay.cover;
      const ex = cv && !cv.small ? cv.cx : DW / 2, ey = cv && !cv.small ? cv.cy : DH * 0.55;
      const r0 = cv && !cv.small ? cv.size * 0.45 : mn * 0.05;
      const life = 1.25;
      let i = idxAt(ons, t);
      const per = Math.round(6 + 22 * B.partAmount);
      ctx.globalCompositeOperation = 'lighter';
      for (; i >= 0 && t - ons[i].t < life; i--) {
        if (ons[i].s < thr) continue;
        const age = t - ons[i].t;
        const q = age / life;
        for (let j = 0; j < per; j++) {
          const a = hash(i * 31 + j, 1) * TAU;
          const v = mn * (0.18 + hash(i * 31 + j, 2) * 0.42) * (0.6 + ons[i].s * 0.6);
          const d = r0 + v * (1 - Math.pow(1 - q, 2.6));
          const x = ex + Math.cos(a) * d, y = ey + Math.sin(a) * d + mn * 0.12 * q * q;
          const r = mn * (0.002 + hash(i * 31 + j, 3) * 0.004) * (1 - q * 0.6);
          ctx.globalAlpha = (1 - q) * (1 - q) * 0.9;
          ctx.fillStyle = rgba(hash(j, 9) > 0.5 ? C.accent : mix(C.accent, [255, 255, 255], 0.6), 1);
          ctx.beginPath();
          ctx.arc(x, y, r, 0, TAU);
          ctx.fill();
        }
      }
    }
    ctx.restore();
  }

  /* ---- cover, meta, progress ---- */
  function rr(ctx, x, y, w, h, r) {

    buf.copyToChannel(L, 0); buf.copyToChannel(R, 1);

  function demoTTML() {
    const beat = 60 / DEMO_BPM;
    const lines = [
      ['v1', [['Го', 'род'], ['га', 'сит'], ['фо', 'на', 'ри']]],
      ['v1', [['Мы'], ['счи', 'та', 'ем'], ['до'], ['за', 'ри']]],
      ['v1', [['Бит'], ['сту', 'чит'], ['в'], ['мо', 'ей'], ['гру', 'ди']]],
      ['v2', [['Не'], ['мол', 'чи,'], ['до', 'го', 'во', 'ри']]],
      ['v1', [['Каж', 'дый'], ['слог'], ['ле', 'тит'], ['на'], ['свет']], [['(на'], ['свет)']]],
      ['v1', [['Э', 'то'], ['наш'], ['с'], ['то', 'бой'], ['ку', 'плет']]],
    ];
    const f = (t) => `${Math.floor(t / 60)}:${(t % 60).toFixed(3).padStart(6, '0')}`;
    let out = '<tt xmlns="http://www.w3.org/ns/ttml" xmlns:ttm="http://www.w3.org/ns/ttml#metadata" xmlns:itunes="http://music.apple.com/lyric-ttml-internal" itunes:timing="Word" xml:lang="ru">\n<head><metadata><ttm:agent type="person" xml:id="v1"/><ttm:agent type="person" xml:id="v2"/></metadata></head>\n<body><div itunes:song-part="Verse">\n';

      const step = (beat * 6) / words.length;
      const spans = (ws, t0, st) => ws.map((syl, wi) => {
        const wb = t0 + wi * st, wd = st * (wi === ws.length - 1 ? 1.3 : 0.94);
        return syl.map((s, si) => `<span begin="${f(wb + (wd * si) / syl.length)}" end="${f(wb + (wd * (si + 1)) / syl.length)}">${s}</span>`).join('');
      }).join(' ');
      const end = Math.min(start + step * (words.length + 0.4) + (bg ? beat * 1.6 : 0), start + 8 * beat - 0.12);
      out += `<p begin="${f(start)}" end="${f(end)}" ttm:agent="${agent}">${spans(words, start, step)}`;
      if (bg) out += ` <span ttm:role="x-bg">${spans(bg, start + step * words.length + beat * 0.35, beat * 0.5)}</span>`;
      out += '</p>\n';
    });
    return out + '</div></body></tt>';
  }

  // any picture becomes a logo that sits well on video: keeps real transparency, otherwise keys out a plain background
  function logoFromImage(img) {
    const sw = img.naturalWidth || img.width, sh = img.naturalHeight || img.height;
    const side = Math.max(sw, sh), out = Math.min(640, side), k = out / side;
    const c = document.createElement('canvas');
    c.width = c.height = out;
    const x = c.getContext('2d', { willReadFrequently: true });
    x.imageSmoothingQuality = 'high';
    x.drawImage(img, (out - sw * k) / 2, (out - sh * k) / 2, sw * k, sh * k);
    const ix = Math.round((out - sw * k) / 2) + 1, iy = Math.round((out - sh * k) / 2) + 1;
    const id = x.getImageData(0, 0, out, out), d = id.data;
    const at = (px, py) => { const i = (Math.min(out - 1, py) * out + Math.min(out - 1, px)) * 4; return [d[i], d[i + 1], d[i + 2], d[i + 3]]; };
    const corners = [at(ix, iy), at(out - 1 - ix, iy), at(ix, out - 1 - iy), at(out - 1 - ix, out - 1 - iy)];
    if (corners.some((p) => p[3] < 250)) {
      // already transparent: a flat dark mark would vanish on video, so turn it white
      let n = 0, lum = 0, chroma = 0;
      for (let i = 0; i < d.length; i += 16) {
        if (d[i + 3] < 128) continue;
        n++;
        lum += (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
        chroma += (Math.max(d[i], d[i + 1], d[i + 2]) - Math.min(d[i], d[i + 1], d[i + 2])) / 255;
      }
      if (n && lum / n < 0.4 && chroma / n < 0.14) {
        for (let i = 0; i < d.length; i += 4) d[i] = d[i + 1] = d[i + 2] = 255;
        x.putImageData(id, 0, 0);
      }
      return c;
    }
    const bg = corners.reduce((a, p) => a + (p[0] * 0.299 + p[1] * 0.587 + p[2] * 0.114) / 255, 0) / 4;
    for (let i = 0; i < d.length; i += 4) {
      if (d[i + 3] < 8) continue;
      const lum = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
      if (bg > 0.5) {

        const mx = Math.max(d[i], d[i + 1], d[i + 2]) / 255;

  }

        tctx.fillRect(x, mid - bh, bw, bh * 2);
      }
      tctx.globalAlpha = 1;
    }
    if (P.lyrics) {
      tctx.fillStyle = css.acc;
      const y = h - Math.max(3, h * 0.09);
      for (const l of P.lyrics.lines) {
        tctx.globalAlpha = t >= l.begin && t <= l.end ? 1 : 0.55;
        tctx.fillRect(px(l.begin), y, Math.max(2, px(l.end) - px(l.begin) - 1), Math.max(3, h * 0.09));

  }
  function loop() {

    const t = now();
    Render.frame(pctx, pv.width, pv.height, t, P, S, exRange());
    drawTimeline(t);
    $('#tcur').textContent = fmt(t, true);
    $('#tl').setAttribute('aria-valuenow', String(Math.round((t / (P.dur || 1)) * 100)));
  }

  /* ---- presets ---- */
  function applyPreset(p) {
    const keep = { export: clone(S.export), aspect: S.frame.aspect, mark: clone(S.mark), qr: clone(S.qr) };
    S = merge(clone(DEFAULTS), clone(p.v));
    S.export = keep.export; S.frame.aspect = keep.aspect; S.mark = keep.mark; S.qr = keep.qr;
    activePreset = p.id;
    store.set('strofa.preset', p.id);
    Render.invalidate();
    syncUI(); loadFaces(); sizePreview(); changed(true);
  }
  function randomLook() {
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    const rnd = (a, b) => Math.round((a + Math.random() * (b - a)) * 100) / 100;
    const font = pick(FONTS);
    const heavy = font[1] ? font[1].filter((w) => w >= 600) : [400];
    const style = pick(['list', 'list', 'karaoke', 'line', 'line', 'poster', 'word']);
    const layout = style === 'poster' || style === 'word' ? pick(['text', 'mini']) : pick(['side', 'side', 'center', 'mini', 'text']);
    applyPreset({ id: 'random', v: {
      frame: { layout, coverShape: pick(['round', 'round', 'square', 'circle', 'vinyl']), coverTilt: Math.random() < 0.25 ? Math.round(rnd(-6, 6)) : 0, coverBorder: Math.random() < 0.2 ? 0.5 : 0, progStyle: pick(['line', 'wave', 'dots']) },
      bg: { style: pick(['cover', 'cover', 'fluid', 'gradient', 'grid', 'aurora', 'tunnel', 'waves', 'dots', 'kaleido']), blur: rnd(0.3, 0.9), dim: rnd(0.25, 0.55), grain: rnd(0, 0.35), speed: rnd(0.4, 1.2), shape: pick(['circle', 'tri', 'square', 'hex']), segments: Math.round(rnd(4, 9)), scan: Math.random() < 0.15 ? 0.3 : 0 },
      text: { style, wordIn: pick(['pop', 'rise', 'fade', 'type', 'all']), font: font[0], weight: pick(heavy.length ? heavy : font[1]), upper: Math.random() < 0.3, sung: pick(['text', 'accent', 'accent']), glow: rnd(0, 0.7), plate: Math.random() < 0.2 ? 0.7 : 0, anchor: style === 'poster' || style === 'word' || layout === 'text' ? 0.5 : 0.4, align: layout === 'side' ? 'auto' : 'center' },
      beat: { viz: pick(['none', 'none', 'bars', 'mirror', 'ring', 'wave', 'scope']), particles: pick(['none', 'dust', 'snow', 'bokeh', 'stars', 'sparks']), punch: rnd(0, 0.6), shake: Math.random() < 0.2 ? rnd(0.1, 0.4) : 0, flash: rnd(0, 0.3), rgb: Math.random() < 0.2 ? rnd(0.2, 0.6) : 0, textBounce: rnd(0, 0.5) },
    } });
  }
  function markPreset() {
    document.querySelectorAll('#looks .chip').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.id === activePreset)));
    const name = $('#lookName');
    if (name) {
      const i = PRESETS.findIndex((p) => p.id === activePreset);
      name.textContent = i >= 0 ? PRESETS[i].name : activePreset === 'random' ? 'Случайный' : 'Свой';
      $('#lookPos').textContent = i >= 0 ? `${i + 1} / ${PRESETS.length}` : '';
    }
  }
  function stepLook(dir) {
    const i = PRESETS.findIndex((p) => p.id === activePreset);
    const n = PRESETS.length;
    applyPreset(PRESETS[i < 0 ? (dir > 0 ? 0 : n - 1) : (i + dir + n) % n]);
  }

  /* ---- build ---- */
  function build() {
    const tabs = $('#tabs'), body = $('#tabbody');
    const panes = {};
    const show = (id) => {
      for (const k in panes) panes[k].pane.hidden = k !== id;
      for (const k in panes) panes[k].btn.setAttribute('aria-selected', String(k === id));
      store.set('strofa.tab', id);
      if (id === 'export') updateEstimate();
    };
    TABS.forEach((tab) => {
      const btn = el('button', { class: 'tab', type: 'button', role: 'tab', id: 'tab-' + tab.id, text: tab.name, onclick: () => show(tab.id) });
      const pane = el('div', { role: 'tabpanel', 'aria-labelledby': 'tab-' + tab.id, style: 'display:flex;flex-direction:column;gap:18px' });
      if (tab.id === 'track') buildTrackTab(pane);
      else if (tab.id === 'export') buildExportTab(pane);
      else tab.groups.forEach((g) => {
        const ge = el('div', { class: 'group' }, el('h3', { text: g.title }));
        g.fields.forEach((f) => ge.append(field(f)));
        groupEls.push({ el: ge, show: g.show });
        pane.append(ge);
      });
      panes[tab.id] = { btn, pane };
      tabs.append(btn);
      body.append(pane);
    });
    const hash = (location.hash || '').replace('#', '');
    show(panes[hash] ? hash : panes[store.get('strofa.tab')] ? store.get('strofa.tab') : 'track');
    const looks = $('#looks');
    const arrow = (d, label, path) => {
      const b = el('button', { type: 'button', 'aria-label': label, title: label, onclick: () => stepLook(d) });
      b.innerHTML = `<svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="${path}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      return b;
    };
    looks.append(el('div', { class: 'stepper', role: 'group', 'aria-label': 'Переключение образа' },
      arrow(-1, 'Предыдущий образ', 'M12.5 4.5 7 10l5.5 5.5'),
      el('span', { class: 'cur', 'aria-live': 'polite' }, el('b', { id: 'lookName', text: '' }), el('i', { id: 'lookPos', text: '' })),
      arrow(1, 'Следующий образ', 'M7.5 4.5 13 10l-5.5 5.5')));
    looks.append(el('button', { class: 'chip dice', type: 'button', 'data-id': 'random', text: 'Случайный', title: 'Собрать случайное сочетание сцены, текста и эффектов', onclick: randomLook }));
  }
  const hostTheme = document.documentElement.getAttribute('data-theme');
  function setTheme(mode, save) {
    const root = document.documentElement;
    if (mode === 'dark' || mode === 'light') root.setAttribute('data-theme', mode);

    else root.removeAttribute('data-theme');
    document.querySelectorAll('#theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.v === mode)));

  }
  function buildTheme() {
    const box = $('#theme');
    [['auto', 'Как в системе'], ['light', 'Светлая'], ['dark', 'Тёмная']].forEach(([v, n]) => box.append(el('button', { type: 'button', 'data-v': v, text: n, onclick: () => setTheme(v, true) })));
    const saved = store.get('strofa.theme');
    setTheme(saved === 'dark' || saved === 'light' ? saved : 'auto', false);
  }
  let dragDepth = 0;
  function hideDrop() { dragDepth = 0; $('#dropHint').hidden = true; }
  function wire() {
    $('#play').addEventListener('click', () => (playing ? pause() : play()));
    document.addEventListener('keydown', (e) => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (e.code === 'Space' && !['input', 'textarea', 'select', 'button'].includes(tag)) { e.preventDefault(); playing ? pause() : play(); }
      if ((e.code === 'BracketLeft' || e.code === 'BracketRight') && !['input', 'textarea', 'select'].includes(tag) && !X.busy) stepLook(e.code === 'BracketLeft' ? -1 : 1);
    });
    const tl = $('#tl');
    let scrub = false, resume = false;
    const at = (e) => { const r = tl.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * P.dur; };
    tl.addEventListener('pointerdown', (e) => { if (X.busy) return; scrub = true; resume = playing; if (playing) pause(); tl.setPointerCapture(e.pointerId); offset = at(e); touch(); });
    tl.addEventListener('pointermove', (e) => { if (scrub) { offset = at(e); touch(); } });
    const up = () => { if (!scrub) return; scrub = false; if (resume) play(); };
    tl.addEventListener('pointerup', up);
    tl.addEventListener('pointercancel', up);
    tl.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight') seek(now() + 2);
      else if (e.key === 'ArrowLeft') seek(now() - 2);
      else if (e.key === 'Home') seek(0);
    });
    window.addEventListener('dragenter', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) { dragDepth++; $('#dropHint').hidden = false; } });
    window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('#dropHint').hidden = true; });
    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => { e.preventDefault(); hideDrop(); if (e.dataTransfer && e.dataTransfer.files.length) routeFiles(e.dataTransfer.files); });
    if (window.ResizeObserver) new ResizeObserver(sizePreview).observe($('#viewer'));
    window.addEventListener('resize', sizePreview);
    const mq = window.matchMedia('(prefers-color-scheme: dark)');
    if (mq.addEventListener) mq.addEventListener('change', readCss);
    new MutationObserver(readCss).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  }

  async function start() {
    build();
    wire();
    buildTheme();
    P.title = 'Фонари'; P.artist = 'talk with a star'; P.demoMeta = true;
    setCover(demoCover(), 'demo', true);
    const lg = new Image();
    lg.onload = () => { P.logoDefault = lg; if (!P.logo) { P.logo = lg; P.logoId = seq++; touch(); } refreshLogoThumb(); };
    lg.src = LOGO_SRC;
    const bl = $('#brandLogo');
    bl.style.webkitMaskImage = bl.style.maskImage = `url(${LOGO_SRC})`;
    bl.classList.add('ready');
    updateQR();
    syncUI(); syncMeta();
    sizePreview();
    setLyrics(demoTTML(), 'demo.ttml', true);
    offset = 11.2;
    requestAnimationFrame(loop);
    probeSupport();
    await setAudio(demoAudio(), 'demo', true);
    offset = 11.2;
    touch();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
